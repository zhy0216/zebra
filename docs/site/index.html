<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zebra — docs</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e;
    --accent: #4f46e5; --border: #d0d7de; --code-bg: #f6f8fa;
    --sidebar-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0;
      --accent: #7c8cf8; --border: #30363d; --code-bg: #161b22;
      --sidebar-bg: #11161d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex;
  }
  nav {
    width: 250px; flex: 0 0 250px; background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 20px 0; overflow-y: auto; height: 100vh; position: sticky; top: 0;
  }
  nav h1 { font-size: 18px; margin: 0 20px 4px; }
  nav p.tag { margin: 0 20px 16px; font-size: 12px; color: var(--muted); }
  nav h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 18px 20px 6px;
  }
  nav a {
    display: block; padding: 5px 20px; color: var(--fg); text-decoration: none;
    font-size: 14px;
  }
  nav a:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  nav a.active { color: var(--accent); font-weight: 600; }
  main { flex: 1; min-width: 0; padding: 32px 48px 96px; max-width: 860px; }
  main.error { color: #cf222e; }
  article h1 { border-bottom: 1px solid var(--border); padding-bottom: 8px; font-size: 28px; }
  article h2 { font-size: 21px; margin-top: 36px; }
  article h3 { font-size: 17px; }
  article pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 14px; overflow-x: auto; font-size: 13px;
  }
  article code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; background: var(--code-bg); padding: 2px 5px; border-radius: 4px;
  }
  article pre code { background: none; padding: 0; }
  article a { color: var(--accent); }
  article blockquote {
    margin: 0; padding: 2px 14px; border-left: 3px solid var(--border); color: var(--muted);
  }
  article table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  article th, article td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 14px;
  }
  article th { background: var(--sidebar-bg); }
  article hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
</style>
</head>
<body>
<nav>
  <h1>Zebra</h1>
  <p class="tag">Bun-first TS web framework</p>
  <h2>Getting started</h2>
  <a data-md="quickstart.md" href="quickstart.md">Quick start</a>

<main id="content"><noscript>
  <p>This site renders Markdown in your browser. Without JavaScript, use the
  sidebar links to view the raw <code>.md</code> sources (rendered natively by
  GitHub).</p>
</noscript></main>
<script>
// Minimal, dependency-free Markdown viewer for the docs/site pages.
// Canonical content is the .md files themselves; this is a presentation shell.
const main = document.getElementById("content");
const links = [...document.querySelectorAll("nav a[data-md]")];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
      '<a href="$2" class="md-link">$1</a>')
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
}
function md(src, base) {
  const lines = src.split(/\r?\n/);
  const out = [];
  let i = 0;
  const code = { open: false, buf: [], lang: "" };
  const flushCode = () => {
    if (!code.open) return;
    out.push("<pre><code>" + esc(code.buf.join("\n")) + "</code></pre>");
    code.open = false; code.buf = [];
  };
  const closeList = () => { if (listTag) { out.push("</" + listTag + ">"); listTag = null; } };
  let listTag = null;
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w*)/);
    if (fence) {
      if (code.open) { flushCode(); } else { code.open = true; }
      closeList(); i++; continue;
    }
    if (code.open) { code.buf.push(line); i++; continue; }
    const m = line.match(/^(#{1,6})\s+(.*)/);
    if (m) { flushCode(); closeList(); const h = m[1].length; out.push(`<h${h}>${inline(m[2])}</h${h}>`); i++; continue; }
    if (line.trim() === "---" || line.trim() === "***") { flushCode(); closeList(); out.push("<hr>"); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      flushCode(); closeList(); const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push("<blockquote>" + md(buf.join("\n"), base) + "</blockquote>");
      continue;
    }
    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+\.\s+(.*)/);
    if (ul || ol) {
      flushCode();
      const tag = ul ? "ul" : "ol";
      if (listTag !== tag) { closeList(); out.push("<" + tag + ">"); listTag = tag; }
      out.push("<li>" + inline((ul || ol)[1]) + "</li>"); i++; continue;
    }
    if (line.trim() === "") { flushCode(); closeList(); i++; continue; }
    if (line.trim().startsWith("|")) {
      flushCode(); closeList();
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out.push("<table>");
      rows.forEach((row, ri) => {
        if (/^\|?[\s:|-]+\|?\s*$/.test(row) && ri === 1) return;
        const tag = ri === 0 ? "th" : "td";
        out.push("<tr>" + cells(row).map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>");
      });
      out.push("</table>");
      continue;
    }
    flushCode(); closeList();
    out.push("<p>" + inline(line) + "</p>"); i++;
  }
  flushCode(); closeList();
  return out.join("\n");
}

async function load(page) {
  try {
    const res = await fetch(page);
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const src = await res.text();
    const base = page.slice(0, page.lastIndexOf("/") + 1);
    main.innerHTML = "<article>" + md(src, base) + "</article>";
    main.classList.remove("error");
    links.forEach(a => a.classList.toggle("active", a.dataset.md === page));
    history.replaceState(null, "", "#" + page);
    window.scrollTo(0, 0);
    main.querySelectorAll("a.md-link").forEach(a => {
      if (a.getAttribute("href").endsWith(".md")) {
        a.addEventListener("click", e => {
          e.preventDefault();
          const href = a.getAttribute("href");
          load(href.startsWith("/") || href.startsWith("http") ? href : href);
        });
      }
    });
  } catch (err) {
    main.classList.add("error");
    main.innerHTML = "<h1>Failed to load " + esc(page) + "</h1><p>" + esc(String(err)) + "</p>";
  }
}

links.forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  load(a.dataset.md);
}));
const initial = location.hash.replace(/^#\/?/, "");
load(initial.endsWith(".md") ? initial : "quickstart.md");
</script>
</body>
</html>
