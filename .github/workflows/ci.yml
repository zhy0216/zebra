name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Full suite on the supported Bun versions. The test suite uses bun:test
  # APIs added in Bun 1.3 (`expectTypeOf`, WebSocket client helpers), so the
  # full run — including `verify:packages` (needs `bun pm pack`, Bun >= 1.1.30)
  # — runs here.
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - run: bun run verify:packages

  # Minimum-version floor: typecheck/lint/build only (the framework runs on
  # Bun >= 1.1.30, but the repository's own tests need Bun >= 1.3).
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
