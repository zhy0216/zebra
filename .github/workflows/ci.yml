name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Full suite on the supported Bun version (baseline: Bun 1.4). The test suite
  # uses bun:test APIs and verify:packages needs `bun pm pack`, so the full run
  # — typecheck, lint, build, test, verify:packages — runs on Bun 1.4 here.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - run: bun run verify:packages

  # Performance regression gate (bench:check) is deliberately NOT part of CI:
  # the baseline is recorded on a specific machine (16-core Apple Silicon) and
  # GitHub's shared ubuntu-latest runners reach only ~half its throughput with
  # high run-to-run noise, so the gate would fail on hardware drift, not on
  # code regressions. Run `bun run bench:check` locally before perf changes.
  #
  # Coverage gate, scoped to packages/core (keeps workspace dist files out of
  # the report); the threshold lives in bunfig.toml ([test] coverageThreshold).
  # The lcov reporter is deliberately not combined with the threshold run —
  # under Bun 1.4 combining both silently skips threshold checks.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun test --coverage packages/core
