name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Full suite on the supported Bun versions. The test suite uses bun:test
  # APIs added in Bun 1.3 (`expectTypeOf`, WebSocket client helpers), so the
  # full run — including `verify:packages` (needs `bun pm pack`, Bun >= 1.1.30)
  # — runs here.
  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - run: bun run verify:packages

  # Minimum-version floor: typecheck/lint/build only (the framework runs on
  # Bun >= 1.1.30, but the repository's own tests need Bun >= 1.3).
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.30"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

  # Performance regression gate (bench:check, median of 3 per scenario, wide
  # thresholds for CI noise). Requires the full workspace because the bench
  # package depends on the workspace zebra packages.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run bench:check

  # Coverage gate, scoped to packages/core (keeps workspace dist files out of
  # the report); the threshold lives in bunfig.toml ([test] coverageThreshold).
  # The lcov reporter is deliberately not combined with the threshold run —
  # Bun 1.3.x silently skips threshold checks when both are enabled.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun test --coverage packages/core
